services:
  npmplus:
    image: zoeyvid/npmplus:latest
    container_name: npmplus
    restart: always
    # NPMplus 는 fancyindex header/footer 를 전역 설정으로 열어두는데,
    # nginx reload 마다 master 가 fd 2개씩 누수 (재현: nginx -s reload 시 +2).
    # 기본 nofile 1024 로는 약 2개월 만에 고갈되어 웹이 죽음 (2026-07-07 122 장애).
    # 상향으로 수년치 여유 확보. upstream 리포트 별도.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    environment:
      TZ: Asia/Seoul
      INITIAL_ADMIN_EMAIL: "${NPM_ADMIN_EMAIL}"
      INITIAL_ADMIN_PASSWORD: "${NPM_ADMIN_PASSWORD}"
      CROWDSEC: "true"
      CROWDSEC_LAPI: "http://crowdsec:8080"
      CROWDSEC_KEY: "${CROWDSEC_BOUNCER_KEY}"
    volumes:
      - npmplus-data:/data
    networks:
      - npmplus-net
      - mailcow-network
    depends_on:
      - crowdsec

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: always
    environment:
      TZ: Asia/Seoul
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve"
      BOUNCER_KEY_npmplus: "${CROWDSEC_BOUNCER_KEY}"
    volumes:
      - npmplus-data:/npmplus-data:ro
      - crowdsec-data:/var/lib/crowdsec
      - crowdsec-config:/etc/crowdsec
    networks:
      - npmplus-net

volumes:
  npmplus-data:
  crowdsec-data:
  crowdsec-config:

networks:
  npmplus-net:
  mailcow-network:
    external: true
    name: mailcowdockerized_mailcow-network
