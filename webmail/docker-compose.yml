services:
  webmail:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    build: /home/webmail
    image: mailstack-webmail:local
    container_name: webmail
    restart: always
    read_only: true
    user: "node"
    tmpfs:
      - /tmp:size=1g,mode=1777
    env_file: /home/webmail/webmail.env
    # pin 모드에서만 setup/update가 override에 추가:
    # volumes: ["/home/webmail/mail-tls-pin.pem:/run/mail-tls-pin.pem:ro,z"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      mailstack-webmail-edge:
        aliases: [webmail]
  webmail-admin:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    image: mailstack-webmail:local
    container_name: webmail-admin
    profiles: ["admin"]
    restart: always
    read_only: true
    user: "node"
    tmpfs:
      - /tmp:size=64m,mode=1777
    env_file: /home/webmail/webmail-admin.env
    mem_limit: 512m
    volumes:
      - webmail-admin-data:/data
      - webmail-brand:/brand
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      mailcow-network:
        aliases: [webmail-admin]
  mailrelay-webmail:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    image: haproxy:3.4.7-alpine@sha256:251da69821897ec8c4819f12b1babbc4b71f562943addc9b9eb14bb6ece40dc6
    container_name: mailrelay-webmail
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    networks:
      mailstack-webmail-edge:
        aliases: [dovecot-mailcow, postfix-mailcow, mysql-mailcow, nginx-mailcow]
      mailcow-network: {}

volumes:
  webmail-admin-data:
  webmail-brand:

networks:
  mailstack-webmail-edge:
    name: mailstack-webmail-edge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  mailcow-network:
    external: true
    name: mailcowdockerized_mailcow-network
