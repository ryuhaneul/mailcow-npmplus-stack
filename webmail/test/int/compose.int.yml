services:
  int:
    image: mailstack-webmail-int:local
    build:
      context: ../..
      dockerfile: test/int/Dockerfile.int
    env_file:
      - /home/rocky/webmail-int.env
    entrypoint: ["node", "test/int/lib/run.js"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - type: bind
        source: /home/rocky/webmail-int-ca.pem
        target: /run/webmail-int-ca.pem
        read_only: true
        bind:
          create_host_path: false
          selinux: z
    networks:
      - mailcow-network
networks:
  mailcow-network:
    external: true
    name: ${WEBMAIL_INT_NETWORK:-mailcowdockerized_mailcow-network}
