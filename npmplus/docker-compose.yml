services:
  npmplus:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    image: zoeyvid/npmplus:2026-07-24-r1@sha256:f7f6ca26082036ee6387a7da336267fe61f16b1eb8087dd964237238b59479ef
    container_name: npmplus
    restart: always
    # NPMplus 는 fancyindex header/footer 를 전역 설정으로 열어두는데,
    # nginx reload 마다 master 가 fd 2개씩 누수 (재현: nginx -s reload 시 +2).
    # 기본 nofile 1024 로는 약 2개월 만에 고갈되어 웹이 죽음 (2026-07-07 122 장애).
    # 상향으로 수년치 여유 확보. upstream 리포트 별도.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:81:81"
    environment:
      TZ: Asia/Seoul
      INITIAL_ADMIN_EMAIL: "${NPM_ADMIN_EMAIL}"
      INITIAL_ADMIN_PASSWORD: "${NPM_ADMIN_PASSWORD}"
      LOGROTATE: "true"
    volumes:
      - npmplus-data:/data
    networks:
      - npmplus-net
      - mailcow-network
    depends_on:
      - crowdsec

  crowdsec:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    image: crowdsecurity/crowdsec:v1.7.8@sha256:2f527c9bb8b367120eb08b82890aa912ce96bfa1ada93dda0721700e4b4e0dde
    container_name: crowdsec
    restart: always
    environment:
      TZ: Asia/Seoul
      COLLECTIONS: "crowdsecurity/nginx crowdsecurity/http-cve ZoeyVid/npmplus crowdsecurity/appsec-crs"
      BOUNCER_KEY_npmplus: "${CROWDSEC_BOUNCER_KEY}"
      DISABLE_SCENARIOS: "crowdsecurity/http-generic-bf crowdsecurity/appsec-native crowdsecurity/crowdsec-appsec-outofband"
      DISABLE_ONLINE_API: "true"
    volumes:
      - npmplus-data:/npmplus-data:ro
      - crowdsec-data:/var/lib/crowdsec
      - crowdsec-config:/etc/crowdsec
    networks:
      - npmplus-net

    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
volumes:
  npmplus-data:
  crowdsec-data:
  crowdsec-config:

networks:
  npmplus-net:
  mailcow-network:
    external: true
    name: mailcowdockerized_mailcow-network
