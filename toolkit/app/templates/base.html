<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="base-url" content="{{ url_for('dashboard') }}">
<title>{% block title %}Mailcow Toolkit{% endblock %}</title>
<script>(function(){var s=localStorage.getItem('tk-theme');document.documentElement.dataset.theme=s==='light'||s==='dark'?s:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})()</script>
<link rel="stylesheet" href="{{ url_for('static', filename='pretendard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<iframe id="starflow-background" data-src="{{ url_for('static', filename='starflow/base-stars.html') }}" tabindex="-1" aria-hidden="true" title="Decorative star background"></iframe>
<div class="page-shell">
<nav class="bar topbar" aria-label="Main navigation">
  <a href="{{ url_for('dashboard') }}" class="topbar-brand" data-i18n="app_name">Mailcow Toolkit</a>
  <div class="topbar-links">
    {% block nav_items %}{% endblock %}
    <span class="lang-switcher">
      <button class="lang-btn" data-lang="ko" onclick="setLang('ko')">한국어</button>
      <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      <button class="lang-btn" data-lang="ja" onclick="setLang('ja')">日本語</button>
    </span>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</nav>

<div class="scroll-content">
<main class="container">
  {% block content %}{% endblock %}
</main>
</div>
</div>

<script src="{{ url_for('static', filename='translations.js') }}"></script>
<script src="{{ url_for('static', filename='theme.js') }}" defer></script>
<script src="{{ url_for('static', filename='starflow/embed-pointer.js') }}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
