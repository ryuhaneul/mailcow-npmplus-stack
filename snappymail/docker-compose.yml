services:
  snappymail:
    image: djmaze/snappymail:v2.38.2@sha256:5e3d990438809a8a49f8ac5758db03e858e6e9fc0e369e1f9e474f7664079905
    container_name: snappymail
    restart: always
    command:
      - /bin/sh
      - -c
      - |
        VER=$$(ls /snappymail/snappymail/v/ | head -1)
        KO_DIR=/snappymail/snappymail/v/$${VER}/app/localization/ko
        if [ -f /var/lib/snappymail/admin_ko.json ] && [ ! -f $${KO_DIR}/admin.json ]; then
          cp /var/lib/snappymail/admin_ko.json $${KO_DIR}/admin.json
        fi
        exec /entrypoint.sh
    volumes:
      - snappymail-data:/var/lib/snappymail
    networks:
      mailstack-snappymail-edge:
        aliases:
          - snappymail
    environment:
      - SECURE_COOKIES=true

  mailrelay-snappymail:
    image: haproxy:3.4.7-alpine@sha256:251da69821897ec8c4819f12b1babbc4b71f562943addc9b9eb14bb6ece40dc6
    container_name: mailrelay-snappymail
    restart: always
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    networks:
      mailstack-snappymail-edge:
        aliases: [dovecot-mailcow, postfix-mailcow]
      mailcow-network: {}

volumes:
  snappymail-data:

networks:
  mailstack-snappymail-edge:
    name: mailstack-snappymail-edge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  mailcow-network:
    external: true
    name: mailcowdockerized_mailcow-network
