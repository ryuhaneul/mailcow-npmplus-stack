services:
  # NPM certificate volume sharing
  nginx-mailcow:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    volumes:
      - npmplus-data:/npm-data:ro
  dovecot-mailcow:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    volumes:
      - npmplus-data:/npm-data:ro
  postfix-mailcow:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    volumes:
      - npmplus-data:/npm-data:ro

  # Mailcow Toolkit (built from /home/mailcow-toolkit)
  toolkit-mailcow:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    build: /home/mailcow-toolkit
    container_name: toolkit-mailcow
    restart: always
    working_dir: /app
    command: ["gunicorn", "-b", "0.0.0.0:5000", "-w", "2", "--access-logfile", "-", "main:app"]
    volumes:
      - /home/mailcow-toolkit/config.yml:/config/config.yml:ro
      - /home/mailcow-toolkit/data:/data
    networks:
      mailcow-network:
    labels:
      - "com.docker.compose.project=mailcowdockerized"

  # Disable acme-mailcow (NPM handles certificates)
  acme-mailcow:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        compress: "false"
    restart: "no"
    entrypoint: ["sleep", "infinity"]

  clamd-mailcow:
